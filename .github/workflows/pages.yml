name: Public Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

# No upload or deployment until the owner explicitly enables the reviewed public edition.
permissions:
  contents: read

concurrency:
  group: public-pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PUBLIC_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare an isolated runner database
        run: |
          python3 scripts/manage.py init
          python3 scripts/manage.py db
          python3 scripts/manage.py build api
          python3 scripts/manage.py test
          docker compose run --rm --no-deps --volume "${GITHUB_WORKSPACE}/fixtures:/fixtures:ro" api python -m pytest -q -p no:cacheprovider
      - name: Collect only allowlisted public sources in another fresh disposable database
        run: python3 scripts/build_public_snapshot.py
        env:
          MONITOR_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      - name: Check frontend and build a static site without API routes
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build:pages
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          MONITOR_PAGES_BASE_PATH: /sextet-monitor
          MONITOR_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/.pages-build/out
      - if: always()
        run: python3 scripts/manage.py stop
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only the static artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
